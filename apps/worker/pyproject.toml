[project]
name = "aerocloud-worker"
version = "0.1.0"
description = "Celery worker for AeroCloud Engine GPU jobs"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aerocloud-engine",
    "celery[redis]>=5.4.0",
    "redis[hiredis]>=5.2.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
    "psd-tools[composite]>=1.10.0",
    "aggdraw>=1.3.18",
    "Pillow>=10.4.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerocloud_worker"]

[tool.uv.sources]
aerocloud-engine = { workspace = true }
