[project]
name = "aerocloud-worker"
version = "0.1.0"
description = "Celery worker for AeroCloud Engine GPU jobs"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aerocloud-engine",
    "celery[redis]>=5.4.0",
    "redis[hiredis]>=5.2.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerocloud_worker"]

[tool.uv.sources]
aerocloud-engine = { workspace = true }
