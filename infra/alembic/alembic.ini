; Alembic configuration for AeroCloud Engine
; Database URL is resolved at runtime from the DATABASE_URL env var
; (see env.py). No URL is baked into this file.

[alembic]
script_location = %(here)s
prepend_sys_path = .
version_path_separator = os
timezone = UTC

[post_write_hooks]
; Run ruff format on migration files after generation
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
