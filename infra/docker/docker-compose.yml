services:
  postgres:
    image: postgres:16-alpine
    container_name: aerocloud-postgres
    environment:
      POSTGRES_DB: aerocloud
      POSTGRES_USER: aerocloud
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerocloud"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aerocloud-redis
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: aerocloud-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aerocloud:devpassword@postgres:5432/aerocloud
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      SEED: "42"
    ports:
      - "8000:8000"

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    container_name: aerocloud-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aerocloud:devpassword@postgres:5432/aerocloud
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      SEED: "42"
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"

volumes:
  postgres-data:
