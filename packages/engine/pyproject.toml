[project]
name = "aerocloud-engine"
version = "0.1.0"
description = "Core geometric and ML engine for AeroCloud — self-learning word cloud rendering"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "AeroCloud Team" }]
license = { text = "Proprietary" }
dependencies = [
    # Core scientific stack (Phase 1 + used everywhere)
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "Pillow>=11.0.0",
    # PyTorch CPU wheel — Phase 1 needs it for determinism test + set_seed()
    # CUDA variant + nvdiffrast come in Phase 5 via optional-dependencies [gpu]
    "torch>=2.5.0",
    # Config + validation (Phase 1 foundation)
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Logging + observability (Phase 1 foundation)
    "structlog>=24.4.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    # Utility libs
    "orjson>=3.10.0",
    "tenacity>=9.0.0",
    "nh3>=0.2.18",
    "safetensors>=0.4.5",
]

[project.optional-dependencies]
# Geometry: Phase 4 (Geometry-v1) + Phase 7 (Geometry-v2)
geometry = [
    "scikit-learn>=1.5.0",
    "scikit-fmm>=2025.6.23",
    "opencv-python-headless>=4.10.0",
    "svgelements>=1.9.6",
    "reportlab>=4.2.0",
    "cachetools>=7.0.0",  # Phase 4 D-17: bytes-bounded LRU cache
    "blake3>=1.0.0",      # Phase 4 D-21: strong content digest for cache key
]
# NLP: Phase 3 (NLP-v1)
nlp = [
    "spacy>=3.7.0,<4.0",
    # lingua 2.2+ ships only cp312+ wheels; engine pins python<3.12 so use 2.1.x.
    # Upgrade tracked for whenever the engine moves to Python 3.12.
    "lingua-language-detector>=2.1,<2.2",
]
# Embeddings: Phase 8 (Semantic Vector Space) — D-07: POT moved from nlp group here
embeddings = [
    "sentence-transformers>=3.0.0",
    "transformers>=4.40.0",
    "umap-learn>=0.5.0",
    "POT>=0.9.5",
    "pgvector>=0.4.0",
]
# GPU / Differentiable Rendering: Phase 5 (Renderer-v1)
# nvdiffrast installed via tool.uv.sources (git) — see root pyproject.toml when Phase 5 begins
gpu = [
    # Phase 5 Renderer-v1: psutil for RSS memory tests (D-20)
    "psutil>=5.9.0",
]
# Quality-Diversity: Phase 9 (Outer Loop-v1)
# Note: PyPI package is named "ribs", not "pyribs" (common source of confusion)
qd = [
    "ribs>=0.10.0",
    "pymoo>=0.6.1",
]
# Production: Phase 12 (Export modules — seam carving, PNG export, boolean union, SVG/PDF export)
production = [
    "shapely>=2.1.2",
    "lxml>=5.0.0",
]

[project.scripts]
aerocloud-gpu-smoke = "aerocloud.scripts.gpu_smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerocloud"]
# Font files live inside the package tree at src/aerocloud/assets/fonts/
# so importlib.resources works in both editable and wheel installs.
