[project]
name = "aerocloud-monorepo"
version = "0.1.0"
description = "AeroCloud Engine monorepo workspace root (not a package)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aerocloud-engine",
    "aerocloud-api",
    "aerocloud-worker",
]

[tool.uv]
managed = true
package = false

[tool.uv.workspace]
members = [
    "packages/engine",
    "apps/api",
    "apps/worker",
]

[tool.uv.sources]
aerocloud-engine = { workspace = true }
aerocloud-api = { workspace = true }
aerocloud-worker = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-env>=1.1.5",
    "hypothesis>=6.120.0",
    "testcontainers>=4.9.0",
    "pytest-benchmark>=4.0.0",  # Phase 4 D-50: geometry performance tests (2048² SDF <1s)
    "pytest-asyncio>=1.3.0",
    "scikit-image>=0.26.0",     # Phase 12 D-05: image processing helpers for export tests
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/engine/src", "apps/api/src", "apps/worker/src"]
extend-exclude = ["node_modules", "_bmad", "wiki", ".planning", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "T20", "RET", "SIM", "ARG", "PTH", "ERA", "PL", "RUF"]
ignore = [
    "PLR0913",  # too-many-arguments (ML often needs many args)
    "PLR2004",  # magic-value (common in ML hyperparameters)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "S101", "ARG001", "ARG002", "PLC0415"]
"packages/engine/tests/**" = ["PLR", "S101", "ARG001", "ARG002", "ARG005", "PLC0415"]
# CLI entry points legitimately print to stdout
"packages/engine/src/aerocloud/scripts/**" = ["T201", "PLC0415", "BLE001"]
"packages/engine/scripts/**" = ["T201", "PLC0415", "E402"]
"scripts/**" = ["T201", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["aerocloud", "aerocloud_api", "aerocloud_worker"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = [
    "^node_modules/",
    "^_bmad/",
    "^wiki/",
    "^\\.planning/",
    "^scripts/",
    "^src/",
    "^build/",
    "^dist/",
    "^\\.venv/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "cachetools.*"
ignore_missing_imports = true

# Celery does not ship complete mypy stubs; the @app.task decorator is untyped.
# Worker task modules use Any for self (Celery Task instance) and suppress
# untyped-decorator errors from third-party Celery code (not our code quality).
[[tool.mypy.overrides]]
module = "aerocloud_worker.tasks.*"
disallow_untyped_decorators = false

# Celery signal decorators (worker_shutting_down.connect etc.) are also untyped.
[[tool.mypy.overrides]]
module = "aerocloud_worker.shutdown"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests/unit", "tests/integration"]
pythonpath = [
    "packages/engine/src",
    "apps/api/src",
    "apps/worker/src",
]
markers = [
    "gpu: requires CUDA-capable GPU (skipped on CPU-only hosts)",
    "slow: long-running tests",
    "integration: spins up postgres+redis via testcontainers",
    "load: load tests (not run by default; run with -m load against a live server)",
    "release_gate: release gate validation (PROD-23); runs full test suite + type check + lint — slow",
]
env = [
    "CUBLAS_WORKSPACE_CONFIG=:4096:8",
]
